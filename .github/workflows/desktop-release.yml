name: Desktop release

on:
  push:
    tags: ["v*"]
  # Also build when a release is created outside this workflow (for example
  # through GitHub's Releases UI or another release automation).
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or new release tag to build
        required: true
        type: string

permissions:
  contents: write

# A tag push and a release publication can happen close together. Serialising
# by tag prevents both events from uploading the same platform asset at once.
concurrency:
  group: desktop-release-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
          # Ship both Windows formats. Defender and SmartScreen treat an
          # unsigned self-extracting NSIS .exe more harshly than an .msi that
          # msiexec executes, so the MSI is the fallback when the setup .exe is
          # quarantined.
          - os: windows-latest
            args: --bundles nsis,msi
          - os: ubuntu-22.04
            args: --bundles appimage
    runs-on: ${{ matrix.os }}
    # Job level so the signing step's own `if` can read AZURE_TENANT_ID: a step
    # cannot see its own `env` block from its condition. trusted-signing-cli
    # also picks these up from the environment during the bundle step.
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: "1.3.0" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux WebKit dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: bun install --frozen-lockfile
      - name: Generate native icons from the web app icon
        run: bun run desktop:icons
      # Authenticode signing is what actually stops Windows Security deleting
      # the installer; everything else only reduces the odds. It stays optional
      # so forks and secret-less runs still produce (unsigned) installers.
      - name: Enable Windows code signing
        if: matrix.os == 'windows-latest' && env.AZURE_TENANT_ID != ''
        env:
          SIGNING_ENDPOINT: ${{ secrets.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.WINDOWS_SIGNING_PROFILE }}
        run: |
          cargo install trusted-signing-cli --version 0.5.0 --locked
          bun run scripts/enable-windows-signing.ts
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # These sign Tauri's updater bundles on every platform. They are
          # separate from optional Apple Developer ID / Windows Authenticode
          # identity signing and are mandatory for in-app updates.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          releaseName: Tonearm ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
          releaseBody: Native desktop builds for macOS 15+, Windows, and Linux. Downloads made inside Tonearm are saved for offline listening.
          # Releases created from a tag or manual run must be public so the
          # installers appear in GitHub's Releases tab. For an existing
          # published release, the action simply attaches the new assets.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          # Prefer MSI when both Windows bundles exist. It is less likely than
          # the unsigned self-extracting NSIS executable to trigger AV.
          updaterJsonPreferNsis: false
          args: ${{ matrix.args }}

  # tauri-action creates the release as a draft and only un-drafts it from the
  # job that happened to create it, so a matrix build can finish with every
  # installer uploaded to a release nobody can download. Publishing here, once,
  # after all three platforms succeed, makes that deterministic.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
